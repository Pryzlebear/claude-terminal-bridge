---
name: "Claude Terminal Bridge"
description: "Claude Terminal plus an MCP bridge so the Claude app can delegate tasks to it"
version: "2.7.0.1"
slug: "claude_terminal"
init: false

# Bridge fork: no prebuilt image — the Supervisor builds this add-on locally
# from the Dockerfile (upstream pulls ghcr.io/heytcass/{arch}-addon-claude-terminal).

# Supported architectures (armv7 dropped in 2.5.0: HAOS dropped 32-bit ARM,
# and neither Claude Code native builds nor managed Python exist for it)
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/Pryzlebear/claude-terminal-bridge"

# Web interface configuration
ingress: true
ingress_port: 7681
panel_icon: mdi:code-braces
panel_title: "Claude Terminal"
panel_admin: true

# Port configuration. Unset by default: ingress reaches the terminal through
# nginx, which admits only the Supervisor (172.30.32.2). Publishing 7681 opens
# the gate to every client — see start_ingress_proxy in run.sh (#146).
ports:
  7681/tcp: null
  8099/tcp: 8099
ports_description:
  8099/tcp: "Claude Terminal Bridge (MCP endpoint for the Claude app, OAuth-protected). Point your Tailscale Funnel / reverse proxy here."
  7681/tcp: "Direct web terminal access. Not needed for ingress, and NOT password-protected: anyone who can reach this port (and any other add-on) gets a root shell in the container, with no Home Assistant login. Leave unset unless the port is firewalled."

# Add-on configuration options
options:
  auto_launch_claude: true
  claude_auto_update: true
  working_directory: ""
  claude_code_oauth_token: ""
  dangerously_skip_permissions: false
  enable_remote_control: false
  claude_extra_args: ""
  ha_smart_context: true
  enable_ha_mcp: true
  ha_mcp_version: "7.11.0"
  persistent_apk_packages: []
  persistent_pip_packages: []
  enable_bridge: true
  bridge_public_url: ""
  bridge_access_key: ""
  bridge_permission_mode: "auto"
  bridge_model: ""
  bridge_timeout_minutes: 20
  bridge_protected_domains:
    - lock
    - alarm_control_panel
  bridge_protected_patterns: []
  bridge_allowed_sources: []
  bridge_notify: true
schema:
  auto_launch_claude: bool?
  claude_auto_update: bool?
  working_directory: str?
  claude_code_oauth_token: password?
  dangerously_skip_permissions: bool?
  enable_remote_control: bool?
  claude_extra_args: str?
  ha_smart_context: bool?
  enable_ha_mcp: bool?
  ha_mcp_version: str?
  persistent_apk_packages:
    - str
  persistent_pip_packages:
    - str
  enable_bridge: bool?
  bridge_public_url: url?
  bridge_access_key: password?
  bridge_permission_mode: list(auto|acceptEdits|dontAsk|plan|bypassPermissions)?
  bridge_model: str?
  bridge_timeout_minutes: int(1,120)?
  bridge_protected_domains:
    - str
  bridge_protected_patterns:
    - str
  bridge_allowed_sources:
    - str
  bridge_notify: bool?

# Left out of HA backups: everything here is rebuilt or downloaded again.
# Supervisor tests each pattern with PurePath.match against the file's full
# path, which matches from the right, so each one is anchored on the data
# folder (whose name ends in the slug) to keep it from matching elsewhere. If
# Supervisor moves to relative-path matching these stop matching, which
# fails safe: backups just grow again.
#   .cache: XDG_CACHE_HOME (uv's ha-mcp cache lives here)
#   home/.claude/cache: Claude Code's own cache
#   home/.local/bin/claude + .local/share/claude/versions: the native Claude
#     install (~250 MB). Always excluded together, so a restore never brings
#     back a launcher without its target. With neither present, the bundled
#     /usr/local/bin/claude runs and update_claude reinstalls in the
#     background.
backup_exclude:
  - "*_claude_terminal/.cache"
  - "*_claude_terminal/home/.claude/cache"
  - "*_claude_terminal/home/.local/bin/claude"
  - "*_claude_terminal/.local/share/claude/versions"

# Volume mappings for file access
map:
  - config:rw            # Home Assistant configuration files
  - all_addon_configs:rw # Other add-ons' config directories (/addon_configs)
  - share:rw             # Shared folder between add-ons and HA

# API access for Home Assistant integration
# hassio_api + role manager: /addons (HA Smart Context lists installed
#   add-ons) needs manager; /core/info and /host/info need only default
# homeassistant_api: the /core/api/* proxy used by ha-context, the tmux
#   status bar, and ha-mcp
# No auth_api: it grants only http://supervisor/auth, which validates a Home
#   Assistant username and password. Nothing here calls it.
hassio_api: true
hassio_role: manager
homeassistant_api: true

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7681]/
